[project]
name = "langgraph-book"
version = "1.0.0"
description = "Runnable examples for the book 'LangGraph: From First Graph to Production'"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain>=1.3,<2",
]

# Only needed for the two chapters that call a real model (27 and 31).
# Everything else in the book runs offline, for free.
[project.optional-dependencies]
real-model = ["langchain-anthropic>=1.7"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]
